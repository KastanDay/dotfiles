- defaults:
    link:
      relink: true

- shell:
  - [mv ~/.bashrc ~/.bashrc_OLD, archive old bashrc file]
  - [mv ~/.zshrc  ~/.zshrc_OLD,  archive old zshrc file]

- link:
    ~/.zshrc: .zshrc_ubuntu
    ~/.zshenv: ../.zshenv
    ~/.bashrc: ../.bashrc
    ~/.zsh_history: ../.zsh_history
    ~/.p10k.zsh: ../.p10k.zsh
    ~/.vim_runtime: ../.vim_runtime
    ~/.vimrc: ../.vimrc
    ~/.tmux.conf: ../tmux.conf 

- create:
    - ~/.vim/undo-history


- shell:
  - [git submodule update --init --recursive, Installing submodules]

  - [sudo dnf makecache --refresh, dnf update (like apt update, but not upgrade)]
  
  # Setup VM
  - [sudo lvextend -l +100%FREE /dev/rhel/root, Expand LVM partition size (1/2)]
  - [sudo xfs_growfs /, Expand XFS filesystem size (2/2)]
  - [echo "$USER ALL=(ALL:ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/$USER, Make the currently logged in user a superuser]

  # Install EPEL repository for additional packages
  - [sudo dnf install -y epel-release, Install EPEL repository]

  # Install common utilities
  - [sudo dnf install -y zsh, zsh]
  - [sudo dnf install -y fzf, fzf - a better grep (sorta different -- awk good too)]
  - [sudo dnf install -y glances, glances - a better top]
  - [sudo dnf install -y bat, bat - a better cat]
  - [sudo dnf install -y rsync, rsync - a better sftp/scp]
  - [sudo dnf install -y make gcc gcc-c++ openssh-server openssl-devel zlib-devel bzip2-devel readline-devel sqlite-devel wget curl llvm ncurses-devel xz tk-devel libffi-devel xz-devel, pyenv & general dependencies]
  # - [sudo dnf install -y lsd, lsd - a better ls]
  - [sudo dnf install -y the_silver_searcher, the_silver_searcher (ag)]
  - [sudo dnf install -y ripgrep, ripgrep (rg)]
  - [curl https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | bash, Lazydocker]
  - [export PATH="$HOME/.local/bin:$PATH", Lazydocker PATH]

  ## Zsh type configs
  - [sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc, OhMyZSH]
  - ['git clone --depth=1 https://github.com/romkatv/powerlevel10k.git ${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/themes/powerlevel10k', PowerLevel10k]
  - ['git clone https://github.com/zsh-users/zsh-autosuggestions ${ZSH_CUSTOM:-~/.oh-my-zsh/custom}/plugins/zsh-autosuggestions', zsh-autosuggestions]
  - ['git clone https://github.com/zsh-users/zsh-syntax-highlighting.git ${ZSH_CUSTOM:-~/.oh-my-zsh/custom}/plugins/zsh-syntax-highlighting', zsh-syntax-highlighting]

  # Rust & cargo 
  - [curl https://sh.rustup.rs -sSf | sh -s -- -y, Install Rust and Cargo]
