- defaults:
    link:
      relink: true
    shell:
      stdout: true
      stderr: true

- create:
    - ~/.config/git

- shell:
  - ['for f in ~/.zshrc ~/.bashrc; do if [ -e "$f" ] && [ ! -L "$f" ]; then mv "$f" "$f.OLD.$(date +%Y%m%d%H%M%S)"; fi; done', back up existing dotfiles before linking]

- link:
    ~/.zshrc: .zshrc_ubuntu
    ~/.zshenv: ../.zshenv
    ~/.bashrc: ../.bashrc
    ~/.zsh_history: ../.zsh_history
    ~/.p10k.zsh: ../.p10k.zsh
    ~/.vim_runtime: ../.vim_runtime
    ~/.vimrc: ../.vimrc
    ~/.tmux.conf: ../tmux.conf 
    ~/.config/git/config: ../git/config
    

- create:
    - ~/.vim/undo-history


- shell:
  - [git submodule update --init --recursive, Installing submodules]

  - [sudo dnf makecache --refresh, dnf update (like apt update, but not upgrade)]
  
  # Setup VM
  - [sudo lvextend -l +100%FREE /dev/rhel/root, Expand LVM partition size (1/2)]
  - [sudo xfs_growfs /, Expand XFS filesystem size (2/2)]
  - ['echo "$USER ALL=(ALL:ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/$USER', Make the currently logged in user a superuser]

  # Install EPEL repository for additional packages
  - [sudo dnf install -y epel-release, Install EPEL repository]

  # Install common utilities
  - [sudo dnf install -y zsh, zsh]
  - [sudo dnf install -y fzf, fzf - a better grep (sorta different -- awk good too)]
  - [sudo dnf install -y glances, glances - a better top]
  - [sudo dnf install -y bat, bat - a better cat]
  - [sudo dnf install -y rsync, rsync - a better sftp/scp]
  - [sudo dnf install -y make gcc gcc-c++ openssh-server openssl-devel zlib-devel bzip2-devel readline-devel sqlite-devel wget curl llvm ncurses-devel xz tk-devel libffi-devel xz-devel, pyenv & general dependencies]
  # - [sudo dnf install -y lsd, lsd - a better ls]
  - [sudo dnf install -y the_silver_searcher, the_silver_searcher (ag)]
  - [sudo dnf install -y ripgrep, ripgrep (rg)]
  - [curl https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | bash, Lazydocker]
  - [export PATH="$HOME/.local/bin:$PATH", Lazydocker PATH]
  - [bash ../scripts/install_uv.sh, Install uv Python tooling]

  ## Zsh type configs
  - ['[ -d "$HOME/.oh-my-zsh" ] || sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc', OhMyZSH]
  - ['theme_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/themes/powerlevel10k"; [ -d "$theme_dir" ] || git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "$theme_dir"', PowerLevel10k]
  - ['plugin_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-autosuggestions"; [ -d "$plugin_dir" ] || git clone https://github.com/zsh-users/zsh-autosuggestions "$plugin_dir"', zsh-autosuggestions]
  - ['plugin_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-completions"; [ -d "$plugin_dir" ] || git clone https://github.com/zsh-users/zsh-completions "$plugin_dir"', zsh-completions]
  - ['plugin_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-syntax-highlighting"; [ -d "$plugin_dir" ] || git clone https://github.com/zsh-users/zsh-syntax-highlighting.git "$plugin_dir"', zsh-syntax-highlighting]

  # Rust & cargo 
  - ['command -v cargo >/dev/null 2>&1 || curl https://sh.rustup.rs -sSf | sh -s -- -y', Install Rust and Cargo]
  - ['command -v lsd >/dev/null 2>&1 || "$(command -v cargo || printf %s "$HOME/.cargo/bin/cargo")" install lsd', Install lsd]
  - ['command -v ds >/dev/null 2>&1 || "$(command -v cargo || printf %s "$HOME/.cargo/bin/cargo")" install dirstat-rs', Install dirstat-rs]

  # nvm
  - ['[ -d "$HOME/.nvm" ] || curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash', Install nvm]
  - ['export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm install 18 && nvm alias default 18', Install Node v18]
  - ['export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm use 18 && { command -v diff-so-fancy >/dev/null 2>&1 || npm install -g diff-so-fancy; }', Install diff-so-fancy for git diffs]
