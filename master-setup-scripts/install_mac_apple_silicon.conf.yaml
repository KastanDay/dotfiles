- defaults:
    link:
      relink: true
    shell:
      stdout: true
      stderr: true

- create:
    - ~/.config/karabiner
    - ~/.config/git
    - ~/.local/bin

- shell:
  - ['for f in ~/.zshrc ~/.zshenv ~/.bashrc ~/.config/karabiner/karabiner.json; do if [ -e "$f" ] && [ ! -L "$f" ]; then mv "$f" "$f.OLD.$(date +%Y%m%d%H%M%S)"; fi; done', back up existing dotfiles before linking]

- clean: ['~', ~/.config/karabiner/karabiner.json]

- link:
    ~/.zshrc: .zshrc_mac
    ~/.zshenv: ../.zshenv
    ~/.vim_runtime: ../.vim_runtime
    ~/.vimrc: ../.vimrc
    ~/.bashrc: ../.bashrc
    ~/.p10k.zsh: ../.p10k.zsh
    ~/.config/karabiner/karabiner.json: ../karabiner.json
    ~/.tmux.conf: ../tmux.conf
    ~/.config/git/config: ../git/config
    ~/.local/bin/notify-kastan: ../bin/notify-kastan
    ~/.local/bin/notify-kastan-pushover-setup: ../bin/notify-kastan-pushover-setup

- create:
    - ~/.vim/undo-history

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [bash ../scripts/brew_bundle_mac_apple_silicon.sh, Install Homebrew packages and apps]
  - [bash ../scripts/install_codex_desktop_mac.sh, Install Codex Desktop app]
  - [bash ../scripts/install_typinator_9_2.sh, Install pinned Typinator 9.2]
  - [bash ../scripts/import_macos_manual_tasks.sh, Import macOS app profiles and presets]
  # - [brew install --cask visual-studio-code-insiders, vscode insiders]
  # - [echo "use GITHUB ACCOUNT for VS Code settings sync", Github account for vscode settings]
  # karabiner-elements, nerd fonts, editors, and CLI tools are installed by brew_bundle_mac_apple_silicon.sh.
  # Typinator is pinned to 9.2 in install_typinator_9_2.sh for license compatibility.
  # iTerm2, Typinator, and BetterTouchTool configs are imported by import_macos_manual_tasks.sh.
  - ['echo "You need to open this link in safari, accept all permissions including kernel extension"', OPEN THIS LINK IN SAFARI!!!!]
  - ['command -v gtree >/dev/null 2>&1 || go install github.com/kitagry/gtree@latest', install gtree for tree-like output of directory structure]
  - [touch ~/.hushlogin, To disable the 'Last login' message in iTerm2]
  
  ## Zsh type configs
  - [echo "---- START ZSH SECTION --", ---- START ZSH SECTION --]
  # - [brew install zsh-autosuggestions, Installing zsh auto-suggestions]
  # - [brew install zsh-completions, Installing zsh auto completions]
  - ['[ -d "$HOME/.oh-my-zsh" ] || sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc', OhMyZSH]
  - ['theme_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/themes/powerlevel10k"; [ -d "$theme_dir" ] || git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "$theme_dir"', PowerLevel10k]
  - ['plugin_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-autosuggestions"; [ -d "$plugin_dir" ] || git clone https://github.com/zsh-users/zsh-autosuggestions "$plugin_dir"', zsh-autosuggestions]
  - ['plugin_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-completions"; [ -d "$plugin_dir" ] || git clone https://github.com/zsh-users/zsh-completions "$plugin_dir"', zsh-completions]
  - ['plugin_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-syntax-highlighting"; [ -d "$plugin_dir" ] || git clone https://github.com/zsh-users/zsh-syntax-highlighting.git "$plugin_dir"', zsh-syntax-highlighting]
  
  - ['command -v cargo >/dev/null 2>&1 || curl https://sh.rustup.rs -sSf | sh -s -- -y', Install Rust & Cargo]
  - ['command -v lsd >/dev/null 2>&1 || "$(command -v cargo || printf %s "$HOME/.cargo/bin/cargo")" install lsd', lsd - a better ls]

  - [echo "macOS app configs imported from MANUAL_TASKS.", LAST STEPS...]


