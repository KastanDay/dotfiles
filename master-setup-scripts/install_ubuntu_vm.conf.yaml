- defaults:
    link:
      relink: true
    shell:
      stdout: true
      stderr: true

- create:
    - ~/.config/git

- shell:
  - ['for f in ~/.zshrc ~/.bashrc; do if [ -e "$f" ] && [ ! -L "$f" ]; then mv "$f" "$f.OLD.$(date +%Y%m%d%H%M%S)"; fi; done', back up existing dotfiles before linking]

- link:
    ~/.zshrc: .zshrc_ubuntu
    ~/.zshenv: ../.zshenv
    ~/.bashrc: ../.bashrc
    ~/.zsh_history: ../.zsh_history
    ~/.p10k.zsh: ../.p10k.zsh
    ~/.vim_runtime: ../.vim_runtime
    ~/.vimrc: ../.vimrc
    ~/.tmux.conf: ../tmux.conf 
    ~/.config/git/config: ../git/config

- create:
    - ~/.vim/undo-history


- shell:
  - [git submodule update --init --recursive, Installing submodules]

  # Tailscale 
  - ['echo $TAILSCALE_AUTHKEY && sleep 5', ⚠️ SET YOUR $TAILSCALE_AUTHKEY. Generate one https://login.tailscale.com/admin/settings/keys  ] # https://tailscale.com/kb/1085/auth-keys
  - [sudo apt update, apt update]
  - [curl -fsSL https://tailscale.com/install.sh | sh, install Tailscale]
  - ['sudo tailscale up --authkey ${TAILSCALE_AUTHKEY}', start Tailscale w/ authkey (need to be in env var)] # https://tailscale.com/kb/1085/auth-keys

  # Setup VM
  - [sudo lvextend -l +100%FREE /dev/ubuntu-vg/ubuntu-lv, Expand LLVM partition size (1/2)]
  - [sudo resize2fs /dev/mapper/ubuntu--vg-ubuntu--lv, Expand LLVM partition size (2/2)]
  - [echo "$USER ALL=(ALL:ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/$USER, Make the currently logged in user a superuser]

  # Install common utilities
  - [sudo apt install -y zsh, zsh]
  - [sudo apt install -y fzf, fzf - a better grep (sorta different -- awk good too)]
  - [sudo apt install -y glances, glances - a better top]
  - [sudo apt install -y bat, bat - a better cat]
  - [sudo apt install -y rsync, rsync - a better sftp/scp]
  - [sudo apt install -y make build-essential openssh-server libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev wget curl llvm libncurses5-dev libncursesw5-dev xz-utils tk-dev libffi-dev liblzma-dev, pyenv & general dependencies]
  - [sudo apt install -y fasd, fasd]
  # - [sudo apt install -y lsd, lsd - a better ls]
  - [sudo apt install -y silversearcher-ag, a bunch of key ones]
  - [sudo apt install -y ripgrep, ripgrep (rg)]
  - [curl https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | bash, Lazydocker]
  - [export PATH="$HOME/.local/bin:$PATH", Lazydocker PATH]
  - [bash ../scripts/install_uv.sh, Install uv Python tooling]

  ## Zsh type configs
  - ['[ -d "$HOME/.oh-my-zsh" ] || sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc', OhMyZSH]
  - ['theme_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/themes/powerlevel10k"; [ -d "$theme_dir" ] || git clone --depth=1 https://github.com/romkatv/powerlevel10k.git "$theme_dir"', PowerLevel10k]
  - ['plugin_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-autosuggestions"; [ -d "$plugin_dir" ] || git clone https://github.com/zsh-users/zsh-autosuggestions "$plugin_dir"', zsh-autosuggestions]
  - ['plugin_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-completions"; [ -d "$plugin_dir" ] || git clone https://github.com/zsh-users/zsh-completions "$plugin_dir"', zsh-completions]
  - ['plugin_dir="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-syntax-highlighting"; [ -d "$plugin_dir" ] || git clone https://github.com/zsh-users/zsh-syntax-highlighting.git "$plugin_dir"', zsh-syntax-highlighting]



